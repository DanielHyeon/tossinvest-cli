site_name: tossinvest-cli
site_description: >-
  토스증권을 AI 에이전트·터미널에서 다루는 비공식 CLI (tossctl) — 공식 Open API(예정)보다
  넓은 조회·거래 범위. An unofficial Toss Securities CLI for AI agents.
site_url: https://junghoonghae.github.io/tossinvest-cli/
repo_url: https://github.com/JungHoonGhae/tossinvest-cli
repo_name: JungHoonGhae/tossinvest-cli
edit_uri: edit/main/website/docs/
copyright: MIT License · 비공식 프로젝트 (토스증권과 무관)

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: 다크 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ko
        - en
  # LLM 우선 산출물(/llms.txt · /llms-full.txt · per-page .md)은 빌드 후
  # gen_llms.py 가 생성한다(i18n 호환을 위해 플러그인 대신 직접 생성).
  # i18n: ko 기본 + en. 파일 접미사 방식 (index.md=ko, index.en.md=en).
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            설치: Install
            빠른 시작: Quick Start
            AI 에이전트 가이드: AI Agent Guide
            명령 레퍼런스: Command Reference
            지원 범위: Support Scope
            안전 모델: Safety Model
            설정: Configuration

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 홈: index.md
  - 설치: install.md
  - 빠른 시작: quickstart.md
  - AI 에이전트 가이드: agents.md
  - 명령 레퍼런스: commands.md
  - 지원 범위: support-scope.md
  - 안전 모델: safety.md
  - 설정: configuration.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/JungHoonGhae/tossinvest-cli
