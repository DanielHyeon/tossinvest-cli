    "summary": "Installing a broker-resident protective SELL never consults readiness, because execgw.Gateway.checkProtection returns immediately when the mutation does not raise exposure (internal/execgw/protection.go:89-91). The supervisor / Wired / manifest / coverage-latch half of the original scope is therefore not required for the safety win and moved to a105. What stays is the half that actually leaves a stop at the broker, and its trigger widened from committed fills to every unprotected position, because all six lanes are OFF so no new fill can occur."
  },
  "prerequisites": [
    "M-A: one real-account conditional order is observed to trigger and fill. Never measured in either market (verify-execution-capability/measurements.md:197). Requires its own human approval at execution time; failure stops the story.",
    "M-B: the unprotected window from engine death to exit-observer re-arm is measured."
  ],
  "acceptance": [
    "Every position with an open exit state and a derived stop converges to exactly one ACTIVE broker-resident protective order, and existing holdings are not distinguished from engine-filled positions",
    "Protection is planned only from journal-committed state, and the broker order id is committed back to the journal",
    "Protection convergence runs outside the fill-detection and reconcile cycles: a convergence failure changes no other loop's outage, freshness SLO or gate",
    "Per-position unprotected time is measured and an alert fires when it exceeds its bound, so a permanent failure is distinguishable from a pending one",
    "A position never carries two live broker-side sell claims: the in-process protective sell cancels the resident order first, cancellation failure never delays the sell, and an already-flat position yields no zero-quantity protective liquidation",
    "The resident trigger is derived only from a scalar persisted in the journal, is replaced only in the safer direction, and is reported as a disaster floor rather than as the engine's current exit line",
    "All nine never-executed refusal branches in the wiring targets are covered by tests before production assembly changes",
    "Protection state persists only through additive-nullable journal columns; a rollback keeps entry OFF and never cancels a broker-resident protective order",
    "Of the four sealed forbidden symbols only protectionofficial.New is unsealed, and the import boundary widens to cover the broker transport and lifecycle packages, which the current walk does not reach",
    "ProtectionWired is still produced by nothing: entry stays structurally closed and the two EntryPermitted failure assertions are left untouched",
    "No lane is activated, no operating toggle is flipped, and functional verification places no live order; the only real-account action is prerequisite M-A under its own human approval"
