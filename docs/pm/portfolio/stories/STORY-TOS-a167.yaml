    "A protective-exit sell order whose remainder stays non-terminal for N seconds (N set by a human) is re-priced and re-ordered; a take-profit remainder is never touched",
    "The engine holds at most one broker sell claim per symbol: a replacement is sent only after the old order is confirmed terminal by an order read, never from the status value alone (M32)",
