{
  "id": "STORY-TOS-a098",
  "title": "Nobody sends what the outbox keeps",
  "feature": "FEAT-TOS-009",
  "intent": "active",
  "openspec": {
    "change_id": "a098-nobody-sends-what-the-outbox-keeps",
    "path": "openspec/changes/a098-nobody-sends-what-the-outbox-keeps"
  },
  "acceptance": [
    "A critical alert written to the outbox has an executor that retries it, because a recorded alert nobody sends is a record and not an alert",
    "That executor is a supervised loop and not a call inside the exit cycle, so a stalled transport cannot lengthen the time a stop takes",
    "The executor's own death does not bring down the other supervised loops, so an alert bug does not become a missing stop",
    "The executor's death is not silent: it latches the entry gate directly and escalates the operating mode durably, because the in-memory latch alone is erased by a restart",
    "A dead executor is not restarted automatically",
    "The operator can read the backlog and release the gate, with no typed confirmation and no extra approval friction",
    "The loop period is measured for this change rather than inherited from another change's constant",
    "Nothing else moves: the lock window, batch fairness, backlog limits and severity routing all stay in a092"
  ]
}
