    "how": "The 2026-10-14 StockOS gap analysis ranked entry signal producers as P2. CodeGraph 1.6.0 and logic-map AST at HEAD 050d092f showed all eight lane instances run but none has a live producer: production proposals come only from a human-signed manifest pinned by digest in the process environment, nothing in production opens evidence.db for writing, the closed-bar and L1 quote producers have zero production callers, and buildLaneInput refuses every breakout scope because ATR, RVOL, upper-wick and volume-expanded are never computed. Breakout-retest is the only family whose evidence can be built from official data alone, so the first story measures whether it fires before any trust anchor, manifest or Jev seam is built on it.",
