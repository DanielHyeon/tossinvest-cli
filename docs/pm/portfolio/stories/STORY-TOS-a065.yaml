  "id": "STORY-TOS-a065",
  "title": "Turn critical alert delivery on with one button, with no hand-edited config and no token to paste",
  "feature": "FEAT-TOS-004",
  "intent": "active",
  "openspec": {
    "change_id": "a065-alerts-turn-on-with-one-button",
    "path": "openspec/changes/a065-alerts-turn-on-with-one-button"
  },
  "acceptance": [
    "One press on the settings screen turns critical alert delivery on: it creates the channel, writes the three configuration keys, records the change in the audit trail and sends one test message",
    "The channel identifier is generated from a cryptographic random source with at least 128 bits and is never asked for on any form, because on a public notification service the channel name is the only access control",
    "No form on the console accepts the transport's authentication token; the self-hosted path continues to read it from the engine's environment",
    "The channel identifier appears in the response body so the operator can subscribe, and never in the audit trail, the structured log or the redirect URL that carries the save result",
    "Turning delivery off writes only the switch and keeps the channel, so muting alerts does not cost a re-subscription on every device",
    "Turning delivery on again reuses the existing channel rather than minting a new one",
    "A failed test message leaves delivery configured and states the reason, because the state a rollback would return to is the defect this story exists to remove",
    "The test message is published outside the critical-alert outbox and changes no entry gate and no operating mode",
    "A build with no notification seam renders a named reason where the button would be, and writes nothing"
  ]
}
