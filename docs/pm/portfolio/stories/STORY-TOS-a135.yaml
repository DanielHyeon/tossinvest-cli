  "id": "STORY-TOS-a135",
  "title": "Capability attestation expiry and scope loss are announced before a restart",
  "feature": "FEAT-TOS-009",
  "intent": "active",
  "openspec": {
    "change_id": "a135-attestation-expiry-is-announced",
