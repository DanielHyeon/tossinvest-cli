    "A held position that is not judged in a cycle where other held symbols were observed is recorded per position, whether its quote was absent, unusable, or expired before use",
    "When the same position stays unjudged for the account outage threshold (default 60 seconds), one critical exit observation outage alert names that position under a per-position key, and repeats only after the position is judged again and drops out again",
