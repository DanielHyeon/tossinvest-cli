  },
  "acceptance": [
    "A stop-loss or baseline-breach exit is submitted as a market order and carries no price field, so exchange tick grid, price bands and quote staleness cannot reject it",
    "Where the broker does not accept market orders (KRX after-hours single-price session, off-hours sessions whose market acceptance is unmeasured or measured as refused) or the session cannot be judged, the protective exit is submitted as the same limit order as before this change (user decision 2026-10-22, design D7)",
    "A take-profit exit keeps its limit price unchanged, because immediacy is not its purpose and a market conversion would widen fill uncertainty against the position",
    "The entry-side LIMIT-only rule is untouched and a buy market order is still rejected, fixed by its own test",
    "The execution gate admits a sell market order and rejects one that carries a price, matching the official API contract that MARKET must not send price",
    "A protective exit no longer refuses for having no price, because the market path needs none",
    "The ledger records an empty order price and a market order type for a market exit, and never records the observed price or the baseline as a submitted price",
    "Operator screens and alerts render a priceless exit intent as a market order rather than as a missing value",
    "The emergency flatten path, the live verification tool and the conditional-order path are unchanged, fixed by tests"
  ]
}
