{
  "id": "STORY-TOS-a087",
  "title": "A protective exit is a market order, not a limit order",
  "feature": "FEAT-TOS-009",
  "intent": "active",
  "openspec": {
    "change_id": "a087-a-protective-exit-is-a-market-order",
