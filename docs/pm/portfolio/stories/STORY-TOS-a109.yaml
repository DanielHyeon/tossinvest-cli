    "note": "a108 fixed the same disease for strategy projection: stage+rename publication, connect-probe liveness, total reclamation. Its engine-safety delta was narrowed to that one endpoint precisely so the general SHALL would not enter the canonical spec as a falsehood; this change earns the general form back by fixing the remaining three.",
    "why_not_a_reversal": "The narrowing was declared, measured, and tracked (a108 design D5-2). This change is the tracked successor, not a contradiction."
