    "how": "a108's adversarial review A1 measured the three sibling engine endpoints (position policy command, position policy runtime, alert control) against the same crash shapes that took the engine down on 2026-08-13. Two of them permanently refuse a pre-chmod socket leftover (listen-to-chmod death under the container's umask 077 leaves a 0700 socket that the exact-0600 check rejects on every boot, and all three are fatal in runEngineRun), and alert control lets a second server mount on top of a live owner's socket. a108's own crash-shape pins could not fail: they only built shapes the tolerant paths trivially pass.",
    "record": "openspec/changes/a108-boot-recovers-from-any-leftover/review.md (§1 F3·F4)"
  },
