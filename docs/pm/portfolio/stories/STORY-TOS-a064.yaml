{
  "id": "STORY-TOS-a064",
  "title": "Make the moment protection stops visible, and let critical alerts actually leave the machine",
  "feature": "FEAT-TOS-009",
  "intent": "active",
  "openspec": {
    "change_id": "a064-critical-events-reach-the-operator",
    "path": "openspec/changes/a064-critical-events-reach-the-operator"
  },
  "acceptance": [
    "The cycle that creates an exit-snapshot quarantine raises a critical event of its own, carrying the position, generation, quarantine version, reason, evidence and quarantine time",
    "All three quarantine-creation paths announce, including the one written inside the judgement transaction, which previously left no record at all",
    "A quarantine already active is not announced again, and a release followed by a re-quarantine under a new version is",
    "A failed observation cycle is written to the structured log instead of being discarded, and a cycle failure alone raises no alert and tightens no operating mode",
    "The critical-alert transport is configurable, defaults to off, and off is indistinguishable from the build that had no transport",
    "The transport's token is read from the environment and has no field in the config file; neither the token nor the channel identifier appears in the audit trail, the structured log or the message body",
    "The notification settings are recorded in the audit trail as whether a channel and a credential exist, with the server address, at startup and before any refusal",
    "A notification setting the engine cannot make sense of does not refuse startup: it runs with no transport, records why, and keeps today's undelivered-alert consequences"
  ]
}
