name: WTS API Monitor

# Weekly: re-extract the Toss WTS web API surface, reclassify, and detect
# added / removed / changed endpoints. Commits the refreshed catalog and
# alerts Discord when the surface changes (new candidates = features to add).

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 01:00 UTC (10:00 KST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wts-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Extract + classify WTS endpoints
        id: scan
        run: |
          export WTS_DATE="$(date -u +%F)"
          export WTS_DIFF_OUT=/tmp/wts_diff.json
          python3 tools/wts_endpoints.py | tee /tmp/wts_summary.txt
          {
            echo "added=$(jq '.added | length' /tmp/wts_diff.json)"
            echo "removed=$(jq '.removed | length' /tmp/wts_diff.json)"
            echo "new_candidates=$(jq '.new_candidates | length' /tmp/wts_diff.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Compose embed
        if: steps.scan.outputs.added != '0' || steps.scan.outputs.removed != '0' || github.event_name == 'workflow_dispatch'
        run: |
          SUMMARY=$(head -1 /tmp/wts_summary.txt)
          ADDED=$(jq -r '.added[]? | "• `\(.)`"' /tmp/wts_diff.json | head -20)
          REMOVED=$(jq -r '.removed[]? | "• `\(.)`"' /tmp/wts_diff.json | head -20)
          [ -n "$ADDED" ] || ADDED="—"
          [ -n "$REMOVED" ] || REMOVED="—"
          trunc() { head -c 1400; }
          CATALOG_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/reverse-engineering/wts-endpoints.json"

          # Components V2 (flags 32768): 표면 변동 주황 Container. daily-monitor 와 같은 톤.
          jq -n \
            --arg title "## WTS API 표면 변동 감지" \
            --arg desc  "$SUMMARY" \
            --arg added   "**신규**"$'\n'"$(printf '%s' "$ADDED"   | trunc)" \
            --arg removed "**삭제/변경**"$'\n'"$(printf '%s' "$REMOVED" | trunc)" \
            --arg foot  "-# 신규 candidate = 개발 후보 · docs/reverse-engineering/wts-endpoints.json" \
            --arg catalog "$CATALOG_URL" \
            '{flags:32768, components:[{
              type:17, accent_color:15105570, components:[
                {type:10, content:$title},
                {type:10, content:$desc},
                {type:14},
                {type:10, content:$added},
                {type:10, content:$removed},
                {type:14},
                {type:10, content:$foot},
                {type:1, components:[
                  {type:2, style:5, label:"카탈로그 보기", url:$catalog}
                ]}
              ]
            }]}' > /tmp/wts_payload.json
          cat /tmp/wts_payload.json

      - name: Send Discord
        if: steps.scan.outputs.added != '0' || steps.scan.outputs.removed != '0' || github.event_name == 'workflow_dispatch'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "::warning::DISCORD_WEBHOOK 미설정 — 알림 skip"; exit 0; fi
          SEP='?'; case "$WEBHOOK" in *\?*) SEP='&';; esac
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data @/tmp/wts_payload.json "${WEBHOOK}${SEP}with_components=true")
          echo "Discord status: $HTTP"

      - name: Commit catalog if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/reverse-engineering/wts-endpoints.json
          git diff --cached --quiet && { echo "변동 없음 — commit skip"; exit 0; }
          git commit -m "chore(wts-monitor): WTS API 카탈로그 갱신 [skip ci]"
          git push origin HEAD:main
