name: Stats

on:
  schedule:
    - cron: '0 23 * * *' # daily, ~08:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update STATS.md (stars backfill + download snapshot)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATS.md docs/.stats-downloads.json
          if git diff --cached --quiet; then
            echo "no stats changes"
          else
            git commit -m "chore(stats): 일일 별점·다운로드 갱신"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
