name: Daily Monitor

on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PR list (24h)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CUTOFF=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json number,title,author,createdAt,updatedAt,additions,deletions \
            --jq "map(select(.createdAt >= \"$CUTOFF\" or .updatedAt >= \"$CUTOFF\"))" \
            > /tmp/prs.json
          cat /tmp/prs.json

      - name: 핵심 API probe
        id: api
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36' \
            'https://wts-info-api.tossinvest.com/api/v2/stock-infos/A005930' || echo ERR)
          echo "$CODE" > /tmp/api_status
          echo "code=$CODE"

      - name: 토스 Open API 페이지 모니터
        id: toss
        run: |
          # 공식 OpenAPI spec 직접 추적. version + endpoint 목록 hash + 전체 내용 hash.
          # 전체 spec 을 레포에 저장해 내부(파라미터·스키마·응답) 변경도 git diff 로 보이게 한다.
          SPEC_URL="https://openapi.tossinvest.com/openapi-docs/latest/openapi.json"
          SPEC_FILE=docs/migration/openapi.latest.json
          SPEC=$(curl -sS --max-time 15 "$SPEC_URL" || true)
          if [ -n "$SPEC" ] && printf '%s' "$SPEC" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$SPEC" | jq -S . > /tmp/spec_norm.json
            VERSION=$(jq -r '.info.version // ""' /tmp/spec_norm.json)
            PATH_COUNT=$(jq '.paths | keys | length' /tmp/spec_norm.json)
            PATHS_SHA=$(jq -S '.paths | keys' /tmp/spec_norm.json | shasum -a 256 | cut -d' ' -f1)
            FULL_SHA=$(shasum -a 256 /tmp/spec_norm.json | cut -d' ' -f1)
          else
            VERSION=""
            PATH_COUNT=0
            PATHS_SHA=""
            FULL_SHA=""
          fi

          DOCS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://developers.tossinvest.com/docs 2>/dev/null || echo ERR)
          LLMS_CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 https://developers.tossinvest.com/llms.txt 2>/dev/null || echo ERR)

          SNAP=docs/migration/.openapi-snapshot.json
          BASE_VERSION=$(jq -r '.spec_version // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_PATHS_SHA=$(jq -r '.spec_paths_sha256 // ""' "$SNAP" 2>/dev/null || echo "")
          BASE_PATH_COUNT=$(jq -r '.spec_path_count // 0' "$SNAP" 2>/dev/null || echo 0)
          BASE_FULL_SHA=$(jq -r '.spec_full_sha256 // ""' "$SNAP" 2>/dev/null || echo "")
          TODAY=$(date -u +%Y-%m-%d)

          REASONS=()
          CHANGED=false

          if [ -n "$VERSION" ] && [ "$VERSION" != "$BASE_VERSION" ]; then
            REASONS+=("🚨 spec version: \`${BASE_VERSION}\` → \`${VERSION}\`")
            CHANGED=true
          fi
          if [ -n "$PATHS_SHA" ] && [ "$PATHS_SHA" != "$BASE_PATHS_SHA" ]; then
            REASONS+=("🚨 endpoint 목록 변경 (${BASE_PATH_COUNT} → ${PATH_COUNT}개)")
            CHANGED=true
          fi
          # 전체 내용 변경 (경로/버전 동일해도 내부 파라미터·스키마 변경 감지)
          if [ -n "$FULL_SHA" ] && [ "$FULL_SHA" != "$BASE_FULL_SHA" ]; then
            if [ "$VERSION" = "$BASE_VERSION" ]; then
              REASONS+=("🔧 spec 내부 변경 (경로·버전 동일, 내용 변경 — openapi.latest.json diff 확인)")
            fi
            CHANGED=true
          fi
          # spec fetch 실패는 일시 장애일 수 있어 변경으로 안 봄 (경고만)
          if [ -z "$VERSION" ]; then
            REASONS+=("⚠️ spec fetch 실패 (일시 장애 가능)")
          fi

          # snapshot 은 실제 내용 변경 시에만 커밋한다. (과거의 last_checked
          # heartbeat 커밋은 월 ~27개 노이즈만 만들어 제거 — 살아있음 증명은
          # Actions 실행 히스토리와 매일 Discord 알림으로 충분.)
          SNAP_DIRTY=false
          if $CHANGED && [ -n "$VERSION" ]; then
            cp /tmp/spec_norm.json "$SPEC_FILE"
            jq -n --arg url "$SPEC_URL" --arg sf "$SPEC_FILE" --arg ver "$VERSION" --argjson pc "$PATH_COUNT" \
              --arg psha "$PATHS_SHA" --arg fsha "$FULL_SHA" --arg docs "$DOCS_CODE" --arg llms "$LLMS_CODE" \
              --arg ts "$TODAY" --arg lc "$TODAY" \
              '{phase:"spec-public",spec_url:$url,spec_file:$sf,spec_version:$ver,spec_path_count:$pc,spec_paths_sha256:$psha,spec_full_sha256:$fsha,docs_url:"https://developers.tossinvest.com/docs",docs_status:$docs,llms_txt_status:$llms,updated_at:$ts,last_checked_at:$lc}' \
              > "$SNAP"
            printf '%s\n' "${REASONS[@]}" > /tmp/toss_reasons.txt
            SNAP_DIRTY=true
          else
            # 변화 없음(또는 일시 fetch 실패) — 커밋 없음. 확인 사실은 Discord 알림에만 남긴다.
            if [ ${#REASONS[@]} -gt 0 ]; then
              printf '%s\n' "${REASONS[@]}" > /tmp/toss_reasons.txt
            else
              echo "⚪️ 변화 없음 (spec \`${VERSION}\`, ${PATH_COUNT} endpoints, 확인 ${TODAY})" > /tmp/toss_reasons.txt
            fi
          fi
          echo "$CHANGED" > /tmp/toss_changed
          echo "$SNAP_DIRTY" > /tmp/snap_dirty
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Compose embed
        run: |
          NOW_KST=$(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')
          API_CODE=$(cat /tmp/api_status)
          TOSS_CHANGED=$(cat /tmp/toss_changed)
          TOSS_REASONS=$(cat /tmp/toss_reasons.txt)
          PR_COUNT=$(jq 'length' /tmp/prs.json)
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          if [ "$PR_COUNT" = "0" ]; then
            PR_BLOCK="신규 PR 없음"
          else
            PR_BLOCK=$(jq -r --arg url "$REPO_URL" '.[] | "• [#\(.number)](\($url)/pull/\(.number)) \(.title) — **@\(.author.login)** `+\(.additions)/-\(.deletions)`"' /tmp/prs.json)
          fi

          if [ "$API_CODE" = "200" ]; then
            API_LINE='`stock-infos/A005930` → **200 OK**'
          else
            API_LINE="status \`$API_CODE\` — Actions IP 차단 vs 실제 회귀, \`tossctl monitor api\` 로 확인"
          fi

          if [ "$TOSS_CHANGED" = "false" ]; then
            TOSS_BLOCK="변화 없음"
          else
            TOSS_BLOCK="$(printf '%s\n' "$TOSS_REASONS" | sed 's/^/• /')"
          fi

          # 상태는 Container accent_color 로만 구분: 정상=초록 / 변경=주황 / API 장애=빨강
          if [ "$API_CODE" != "200" ]; then
            COLOR=15548997; TITLE="tossctl daily — 핵심 API 이상"
          elif [ "$PR_COUNT" != "0" ] || [ "$TOSS_CHANGED" = "true" ]; then
            COLOR=15105570; TITLE="tossctl daily — 확인할 변동 있음"
          else
            COLOR=3901789;  TITLE="tossctl daily — 모두 정상"
          fi

          # Discord Components V2 (flags 32768): Container(accent_color=상태색) 안에
          # Text Display 섹션들 + Separator + issue #31 링크 버튼. content/embeds 미사용.
          trunc() { head -c 1400; }
          jq -n \
            --argjson color "$COLOR" \
            --arg title "## $TITLE" \
            --arg pr   "**PR (24h)**"$'\n'"$(printf '%s' "$PR_BLOCK"   | trunc)" \
            --arg api  "**핵심 API**"$'\n'"$(printf '%s' "$API_LINE"   | trunc)" \
            --arg toss "**토스 Open API**"$'\n'"$(printf '%s' "$TOSS_BLOCK" | trunc)" \
            --arg foot "-# tossctl daily monitor · $NOW_KST KST · 인증 필요 endpoint 는 \`tossctl monitor api\`" \
            --arg issue "${REPO_URL}/issues/31" \
            '{flags:32768, components:[{
              type:17, accent_color:$color, components:[
                {type:10, content:$title},
                {type:14},
                {type:10, content:$pr},
                {type:10, content:$api},
                {type:10, content:$toss},
                {type:14},
                {type:10, content:$foot},
                {type:1, components:[
                  {type:2, style:5, label:"issue #31", url:$issue}
                ]}
              ]
            }]}' > /tmp/payload.json
          echo "--- payload ---"; cat /tmp/payload.json

      - name: Send Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::error::DISCORD_WEBHOOK secret 미설정"
            exit 1
          fi
          # Components V2 는 웹훅이 with_components=true 일 때만 존중한다 (없으면 드롭 → 50006)
          SEP='?'; case "$WEBHOOK" in *\?*) SEP='&';; esac
          HTTP=$(curl -sS -o /tmp/resp -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            --data @/tmp/payload.json "${WEBHOOK}${SEP}with_components=true")
          echo "Discord status: $HTTP"
          cat /tmp/resp || true
          [ "$HTTP" = "204" ] || exit 1

      - name: Commit snapshot (실제 spec 변경 시에만)
        if: hashFiles('docs/migration/.openapi-snapshot.json') != ''
        run: |
          if [ "$(cat /tmp/snap_dirty 2>/dev/null)" != "true" ]; then
            echo "갱신할 내용 없음 — commit skip"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/migration/.openapi-snapshot.json docs/migration/openapi.latest.json
          git diff --cached --quiet && { echo "이미 최신"; exit 0; }
          git commit -m "docs(migration): openapi-snapshot 자동 갱신"
          git push origin HEAD:main

      - name: README 🆕 마커 자동 갱신 (롤링 30일 윈도우)
        run: |
          python3 tools/update_new_markers.py
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md README.en.md
          git diff --cached --quiet && { echo "🆕 마커 최신"; exit 0; }
          git commit -m "docs(readme): 🆕 마커 자동 갱신 (최근 한 달 윈도우) [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main

      # spec 변경이 감지되면(같은 실행 안에서) 구독 토큰으로 Claude 를 돌려 변경을 분석한다.
      # Claude 는 분석 파일 1개만 작성하고, PR 생성은 다음 스텝(결정적 bash)이 한다 —
      # 액션의 자체 브랜치 관리와 충돌하지 않게 역할을 분리.
      - name: 공식 spec 변경 분석 (Claude, 구독 토큰)
        if: steps.toss.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "Read,Grep,Glob,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(grep:*)"'
          prompt: |
            방금 이 실행에서 공식 Toss Open API spec(`docs/migration/openapi.latest.json`) 변경이 커밋되었다.
            이 변경을 분석해 **마크다운 파일 하나만 Write 로 작성**하라.
            (git commit/push/checkout/branch, gh, PR 생성은 절대 하지 마라 — 그건 다음 스텝이 자동으로 한다.
            너는 오직 분석 + 파일 작성만.)

            절차:
            1. 최신 spec 커밋 diff 확인: `git log -1 --format=%H -- docs/migration/openapi.latest.json`
               → `git show <sha> -- docs/migration/openapi.latest.json`. 무엇이 바뀌었는지 파악
               (신규/삭제 엔드포인트, 스키마·에러 문서, 버전 범프).
            2. tossctl 커버리지 대조: 신규 엔드포인트면 `internal/official/`·`internal/mcp/operations.go` grep.
               삭제·변경이면 우리 구현이 영향받는지 확인.
            3. 분류: (a) no-op / (b) 신규 기능 후보 / (c) breaking 위험.
            4. `docs/reverse-engineering/change-analysis/<오늘 UTC 날짜 YYYY-MM-DD>.md` 를 Write 로 작성.
               첫 줄은 `# API 변경 분석 — <YYYY-MM-DD>`. 내용(한국어): 변경 요약, 커버리지 대조, 분류, 권장 후속 조치.
               breaking 위험(c)이면 문서 최상단에 `> breaking-risk` 한 줄을 넣는다.
            실계좌 데이터 금지. 라이브 API 호출 금지(레포 내 파일 분석만).
            변경이 사소하면(문서 diff 없음 등) 파일을 만들지 말고 종료.

      # 결정적 PR 생성: Claude 가 남긴 분석 파일이 있으면 github-actions 봇으로 커밋하고
      # (Claude 가 분석했으므로 Co-Authored-By: Claude), gh 로 PR 을 연다.
      - name: 분석 결과 PR 생성
        if: steps.toss.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          FILE="docs/reverse-engineering/change-analysis/${DATE}.md"
          if [ ! -f "$FILE" ]; then
            echo "분석 파일 없음 — Claude 가 no-op 판단, PR 생략"; exit 0
          fi
          BR="analysis/api-change-$(date -u +%Y%m%d)"
          if gh pr list --state open --head "$BR" --json number -q '.[].number' | grep -q .; then
            echo "이미 오늘자 PR 존재 — 생략"; exit 0
          fi
          TITLE_PREFIX=""
          grep -qi "breaking-risk" "$FILE" && TITLE_PREFIX="[breaking-risk] "
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BR"
          git add "$FILE"
          git commit -m "$(printf 'docs(analysis): API 변경 분석 %s\n\nCo-Authored-By: Claude <noreply@anthropic.com>' "$DATE")"
          git push -u origin "$BR"
          gh pr create --base main --head "$BR" \
            --title "${TITLE_PREFIX}docs(analysis): API 변경 분석 ${DATE}" \
            --body "$(printf '%s\n\n---\nClaude 자동 분석 (daily-monitor). 검토 후 머지 또는 닫기 하세요.' "$(cat "$FILE")")"
